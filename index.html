<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-gray-800">
    <div class="max-w-2xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden p-8 sm:p-10">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-indigo-600 mb-3 tracking-tight">AI Prompt Agent</h1>
            <p class="text-gray-500">당신의 상황을 알려주세요. 가장 적합한 AI와 완벽한 프롬프트를 찾아드립니다.</p>
        </div>

        <div class="space-y-6">
            <div>
                <label for="scenario" class="block text-sm font-semibold text-gray-700 mb-2">어떤 작업이 필요하신가요?</label>
                <textarea id="scenario" rows="4" class="w-full p-4 border border-gray-200 rounded-xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 transition shadow-sm resize-none outline-none text-gray-700" placeholder="예: 스타트업 마케팅 신입사원을 위한 면접 예상 질문 10개를 뽑아줘."></textarea>
            </div>

            <button id="action-btn" onclick="generatePrompt()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-4 rounded-xl transition duration-200 shadow-lg hover:shadow-indigo-300/50">
                최적의 AI 및 프롬프트 추천받기
            </button>
        </div>

        <!-- 결과 영역 -->
        <div id="result-section" class="mt-10 hidden opacity-0 transition-opacity duration-500">
            <div class="border-t border-gray-100 pt-8">
                <h2 class="text-xl font-bold mb-4 text-gray-800">추천 결과</h2>
                
                <div class="bg-indigo-50/50 rounded-2xl p-6 mb-6 border border-indigo-100">
                    <p class="text-sm font-medium text-indigo-800 mb-2">가장 적합한 AI 모델</p>
                    <div class="flex items-center justify-between">
                        <p id="ai-model-name" class="text-3xl font-bold text-indigo-900 tracking-tight"></p>
                        <a id="ai-link" href="#" target="_blank" class="text-sm font-semibold bg-white text-indigo-600 border border-indigo-200 px-4 py-2 rounded-lg hover:bg-indigo-50 transition shadow-sm">
                            사이트로 이동 ↗
                        </a>
                    </div>
                    <p id="ai-reason" class="text-sm text-gray-600 mt-3 leading-relaxed"></p>
                </div>

                <div class="mb-2">
                    <div class="flex justify-between items-center mb-3">
                        <p class="text-sm font-semibold text-gray-700">전문가 수준으로 변환된 프롬프트</p>
                        <button onclick="copyPrompt()" class="text-xs font-bold text-indigo-600 hover:text-indigo-800 bg-indigo-50 px-3 py-1.5 rounded-md transition">복사하기</button>
                    </div>
                    <div class="bg-gray-50 rounded-2xl p-5 border border-gray-200 relative">
                        <p id="generated-prompt" class="whitespace-pre-wrap text-sm text-gray-700 leading-relaxed font-mono"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function generatePrompt() {
            const scenarioInput = document.getElementById('scenario');
            const scenario = scenarioInput.value;
            
            if (!scenario.trim()) {
                alert("시나리오를 입력해주세요!");
                return;
            }

            const actionButton = document.getElementById('action-btn');
            const originalText = actionButton.innerText;
            actionButton.innerText = 'AI가 분석 및 생성 중입니다...';
            actionButton.disabled = true;
            actionButton.classList.add('opacity-75');

            try {
                // 백엔드 API로 요청을 보냅니다.
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ scenario: scenario })
                });

                if (!response.ok) {
                    throw new Error('API 응답 실패');
                }

                const data = await response.json();

                // 전달받은 데이터를 화면에 채워 넣습니다.
                document.getElementById('ai-model-name').innerText = data.modelName;
                document.getElementById('ai-link').href = data.siteUrl;
                document.getElementById('ai-reason').innerText = data.reason;
                document.getElementById('generated-prompt').innerText = data.generatedPrompt;

                const resultSection = document.getElementById('result-section');
                resultSection.classList.remove('hidden');
                
                setTimeout(() => {
                    resultSection.classList.remove('opacity-0');
                    resultSection.classList.add('opacity-100');
                }, 50);

            } catch (error) {
                alert('요청 처리 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
                console.error(error);
            } finally {
                actionButton.innerText = originalText;
                actionButton.disabled = false;
                actionButton.classList.remove('opacity-75');
            }
        }

        function copyPrompt() {
            const promptText = document.getElementById('generated-prompt').innerText;
            navigator.clipboard.writeText(promptText).then(() => {
                alert("프롬프트가 성공적으로 복사되었습니다! 이동하기 버튼을 눌러 해당 AI 창에 바로 붙여넣어 보세요.");
            });
        }
    </script>
</body>
</html>
